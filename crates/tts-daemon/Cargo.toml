[package]
name = "tts-daemon"
version = "0.1.0"
edition = "2021"
description = "Lilith-TTS background daemon: global hotkey (Ctrl+T+T+M), IPC server, TTS engine"

[[bin]]
name = "lilith-tts-daemon"
path = "src/main.rs"

[dependencies]
tts-core = { path = "../tts-core" }

tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tokio-util = { workspace = true }

# Linux input event reading for global hotkey (works on both X11 and Wayland)
# Reads directly from /dev/input/event* — user must be in the 'input' group
evdev = "0.12"

# File locking for single-instance daemon
fs2 = "0.4"
