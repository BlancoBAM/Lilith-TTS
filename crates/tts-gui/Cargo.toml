[package]
name = "tts-gui"
version = "0.1.0"
edition = "2021"
description = "Lilith-TTS panel GUI: popup controls, tray icon, settings"

[[bin]]
name = "lilith-tts"
path = "src/main.rs"

[dependencies]
tts-core = { path = "../tts-core" }

tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# GUI — use tiny-skia (software renderer) to avoid wgpu/ashpd async conflict.
# Perfectly fine for a small panel popup; no GPU required.
iced = { version = "0.13", default-features = false, features = [
    "tokio",
    "image",
    "advanced",
    "tiny-skia",
] }

# System tray icon via StatusNotifierItem D-Bus protocol
ksni = "0.2"

# File dialogs (for voice reference file picker)
rfd = { version = "0.15", default-features = false, features = ["tokio", "xdg-portal"] }

# Unix socket client to talk to daemon
tokio-util = { version = "0.7", features = ["codec"] }

# Config paths
dirs = "5.0"
