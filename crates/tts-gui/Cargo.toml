[package]
name = "tts-gui"
version = "0.1.0"
edition = "2021"
description = "Lilith-TTS COSMIC panel applet — popup controls and settings"

[[bin]]
name = "lilith-tts"
path = "src/main.rs"

[dependencies]
tts-core = { path = "../tts-core" }

tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tokio-util = { workspace = true }
dirs = { workspace = true }

# COSMIC applet framework
libcosmic = { git = "https://github.com/pop-os/libcosmic.git", features = [
    "applet",
    "applet-token",
    "dbus-config",
    "multi-window",
    "tokio",
    "wayland",
    "winit",
] }

# Fluent i18n — must match the template's exact versions
i18n-embed = { version = "0.16", features = ["fluent-system", "desktop-requester"] }
i18n-embed-fl = "0.10"
rust-embed = "8.11"

# File picker dialogs (voice reference + model file)
rfd = { version = "0.15", default-features = false, features = ["tokio", "xdg-portal"] }
