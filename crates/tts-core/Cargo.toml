[package]
name = "tts-core"
version = "0.1.0"
edition = "2021"
description = "Core TTS engine, config, and reader library for Lilith-TTS"

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

# Async trait support for TtsProvider
async-trait = "0.1"

# Audio playback — subprocess approach: paplay (PipeWire/PulseAudio) → aplay fallback
# No alsa-sys build dependency needed; works natively on Lilith Linux
tempfile = "3"

# Clipboard access (X11 + Wayland)
arboard = { version = "3.4", default-features = false, features = ["wayland-data-control"] }

# HTML content extraction (no atspi Rust crate needed — we use Python subprocess)
scraper = "0.22"

# HTTP client (for NeuTTS server and Crane-OAI TTS backend)
reqwest = { version = "0.12", features = ["json", "stream", "multipart"] }
bytes = "1.6"

# Config paths
dirs = "5.0"

# Async streams
tokio-stream = "0.1"
