<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <!-- Lilith TTS symbolic icon: waveform + crescent moon -->
  <!-- COSMIC renders symbolic icons with the current text colour -->
  
  <!-- Moon crescent -->
  <path d="M 8 2 A 6 6 0 1 0 8 14 A 4 4 0 1 1 8 2 Z" fill="currentColor"/>
  
  <!-- Waveform bars inside the moon area -->
  <rect x="4.5" y="7" width="1" height="2" rx="0.5" fill="currentColor" opacity="0.7"/>
  <rect x="6"   y="6" width="1" height="4" rx="0.5" fill="currentColor"/>
  <rect x="7.5" y="5" width="1" height="6" rx="0.5" fill="currentColor" opacity="0.9"/>
  <rect x="9"   y="6.5" width="1" height="3" rx="0.5" fill="currentColor" opacity="0.7"/>
  <rect x="10.5" y="7.5" width="1" height="1" rx="0.5" fill="currentColor" opacity="0.5"/>
</svg>
